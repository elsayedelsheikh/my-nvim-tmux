"$schema" = 'https://starship.rs/config-schema.json'

# Minimal one-line prompt — transparent background, ">" separators.
format = """
$directory\
$git_branch\
$git_status\
$conda\
$cmd_duration\
$character"""

add_newline = false
palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_sep = '#665c54'
color_blue = '#83a598'
color_aqua = '#8ec07c'
color_green = '#b8bb26'
color_orange = '#fe8019'
color_purple = '#d3869b'
color_red = '#fb4934'
color_yellow = '#fabd2f'

[directory]
style = "bold color_yellow"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "color_red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = " "
style = "color_purple"
format = '[ on](color_sep)[$symbol$branch]($style)'

[git_status]
style = "color_orange"
format = '[ $all_status$ahead_behind]($style)'

[python]
disabled = true

[conda]
symbol = "🅒 "
style = "color_aqua"
format = '[ $symbol$environment]($style)'
ignore_base = false

[cmd_duration]
min_time = 2000
style = "color_sep"
format = '[ took $duration]($style)'

[character]
format = ' $symbol '
success_symbol = '[❯](bold color_green)'
error_symbol = '[❯](bold color_red)'
vimcmd_symbol = '[❮](bold color_green)'
vimcmd_replace_one_symbol = '[❮](bold color_purple)'
vimcmd_replace_symbol = '[❮](bold color_purple)'
vimcmd_visual_symbol = '[❮](bold color_yellow)'
